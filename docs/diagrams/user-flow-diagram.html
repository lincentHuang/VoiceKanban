<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧型 AI 任務管理看板 · 使用者互動流程圖 (繁體中文版)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F8FAFC;
      --color-ink:     #0F172A;
      --color-muted:   #64748B;
      --color-border:  #E2E8F0;
      --color-accent:  #EA580C;
      --color-blue:    #2563EB;
      --color-emerald: #059669;
      --font-sans:     'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif:    'Noto Serif TC', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1240px; width: 100%; }

    .header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 1.25rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.35rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 2.8vw + 0.5rem, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
    }

    .meta {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--color-muted);
      text-align: right;
      line-height: 1.5;
    }

    .diagram-container {
      background: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      overflow-x: auto;
    }

    svg {
      width: 100%;
      min-width: 1080px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <div>
        <p class="eyebrow">使用者旅程與操作規範 · 使用者互動流程圖</p>
        <h1>智慧型 AI 任務管理看板 · 使用者互動流程圖</h1>
      </div>
      <div class="meta">
        <div>訪客進入 · 多模態極速輸入 · 看板拖曳執行 · 雲端同步</div>
        <div>零摩擦 AI 智慧工作流全景</div>
      </div>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1120 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="使用者互動流程圖">
        <defs>
          <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#E2E8F0"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#EA580C"/>
          </marker>
          <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
          </marker>
          <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
          </marker>
          <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
          </filter>
        </defs>

        <!-- 背景網格 -->
        <rect width="100%" height="100%" fill="#FAFAFC"/>
        <rect width="100%" height="100%" fill="url(#grid-dots)" opacity="0.6"/>

        <!-- ==================== 流程階段區域 (Swimlanes / Zones) ==================== -->
        <!-- 階段 1：進入與身分存取 -->
        <rect x="25" y="30" width="230" height="720" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <rect x="40" y="42" width="150" height="20" rx="3" fill="#E2E8F0"/>
        <text x="115" y="56" fill="#475569" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">1. 進入與身分存取</text>

        <!-- 階段 2：AI 多模態任務輸入 -->
        <rect x="270" y="30" width="310" height="720" rx="8" fill="#FFF7ED" fill-opacity="0.4" stroke="#FED7AA" stroke-width="1"/>
        <rect x="285" y="42" width="180" height="20" rx="3" fill="#FFEDD5"/>
        <text x="375" y="56" fill="#C2410C" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">2. 多模態 AI 任務建立</text>

        <!-- 階段 3：看板工作區操作 -->
        <rect x="595" y="30" width="300" height="720" rx="8" fill="#EFF6FF" fill-opacity="0.4" stroke="#BFDBFE" stroke-width="1"/>
        <rect x="610" y="42" width="180" height="20" rx="3" fill="#DBEAFE"/>
        <text x="700" y="56" fill="#1D4ED8" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">3. 看板執行與視圖管理</text>

        <!-- 階段 4：持久化與雲端同步 -->
        <rect x="910" y="30" width="185" height="720" rx="8" fill="#ECFDF5" fill-opacity="0.4" stroke="#A7F3D0" stroke-width="1"/>
        <rect x="925" y="42" width="150" height="20" rx="3" fill="#D1FAE5"/>
        <text x="1000" y="56" fill="#047857" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">4. 本地持久化與同步</text>

        <!-- ==================== 流程導線 (Flow Connectors) ==================== -->
        <!-- 開始 -> 身分判斷 -->
        <path d="M 140,115 V 150" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
        
        <!-- 身分判斷 -> 訪客 (向下) 與 雲端登入 (右下) -->
        <path d="M 140,240 V 285" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
        <path d="M 195,195 H 225 V 390 H 140 V 415" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-emerald)"/>

        <!-- 訪客/雲端 -> 工作區水合完成 -->
        <path d="M 140,345 V 415" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
        
        <!-- 工作區 -> 進入多模態輸入分流 -->
        <path d="M 140,475 V 530 H 250" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

        <!-- 多模態分流 -> 3 種輸入途徑 -->
        <path d="M 250,530 H 290 Q 298,530 298,522 V 135 H 330" fill="none" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <path d="M 250,530 H 330" fill="none" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <path d="M 250,530 H 290 Q 298,530 298,538 V 650 H 330" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>

        <!-- 語音路徑：錄音 -> Gemini AI 解析 -> 簡約預覽 -->
        <path d="M 440,135 H 470" fill="none" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <path d="M 525,185 V 230" fill="none" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <path d="M 525,305 V 360" fill="none" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- 自然語言速記 -> 解析 -> 插入看板 -->
        <path d="M 450,530 H 620" fill="none" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- 手動新增 -> 插入看板 -->
        <path d="M 450,650 H 620" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>

        <!-- 語音確認建立 -> 插入看板 -->
        <path d="M 525,430 V 490 H 620" fill="none" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- 看板互動：插入首位 -> 拖曳重排 / 筆記 / 雙視圖 -->
        <path d="M 740,530 V 580" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <path d="M 740,470 V 425" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
        <path d="M 740,355 V 305" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

        <!-- 看板操作 -> 本地持久化 / 雲端同步 -->
        <path d="M 860,530 H 940" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-emerald)"/>
        <path d="M 860,265 H 940" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-emerald)"/>

        <!-- 導線遮罩標籤 -->
        <rect x="145" y="250" width="55" height="15" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="172" y="261" fill="#2563EB" font-size="8" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">訪客優先</text>

        <rect x="200" y="295" width="55" height="15" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="227" y="306" fill="#059669" font-size="8" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">帳號登入</text>

        <rect x="535" y="475" width="80" height="15" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="575" y="486" fill="#EA580C" font-size="8" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">建立任務卡片</text>

        <!-- ==================== 流程節點 (Nodes) ==================== -->

        <!-- [階段 1：進入節點] -->
        <!-- 開始橢圓 -->
        <g filter="url(#card-shadow)">
          <rect x="65" y="80" width="150" height="36" rx="18" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
          <text x="140" y="103" fill="#FFFFFF" font-size="11.5" font-family="'Noto Sans TC', sans-serif" font-weight="600" text-anchor="middle">使用者開啟系統</text>
        </g>

        <!-- 身分判斷菱形 -->
        <g filter="url(#card-shadow)">
          <polygon points="140,150 195,195 140,240 85,195" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
          <text x="140" y="191" fill="#0F172A" font-size="10" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">會話身分？</text>
          <text x="140" y="205" fill="#64748B" font-size="8.5" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">訪客 vs 登入</text>
        </g>

        <!-- 訪客模式節點 -->
        <g filter="url(#card-shadow)">
          <rect x="55" y="285" width="170" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
          <text x="140" y="307" fill="#2563EB" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">訪客優先模式 (Guest)</text>
          <text x="140" y="324" fill="#0F172A" font-size="11.5" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">零摩擦立即上手</text>
          <text x="140" y="337" fill="#64748B" font-size="9.5" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">初始化本機存儲</text>
        </g>

        <!-- 工作區載入完成 -->
        <g filter="url(#card-shadow)">
          <rect x="55" y="415" width="170" height="60" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
          <text x="140" y="437" fill="#475569" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">工作區狀態水合</text>
          <text x="140" y="454" fill="#0F172A" font-size="11.5" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">載入看板與狀態欄位</text>
          <text x="140" y="467" fill="#64748B" font-size="9.5" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">Zustand 狀態中心就緒</text>
        </g>

        <!-- [階段 2：AI 多模態輸入] -->
        <!-- 語音輸入路徑 (橘色焦點) -->
        <g filter="url(#card-shadow)">
          <rect x="330" y="105" width="110" height="60" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="385" y="127" fill="#EA580C" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">A. 語音 FAB</text>
          <text x="385" y="144" fill="#0F172A" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">長按空白鍵/點擊</text>
          <text x="385" y="157" fill="#EA580C" font-size="9" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">即時聲波頻譜</text>
        </g>

        <g filter="url(#card-shadow)">
          <rect x="470" y="105" width="100" height="60" rx="6" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2"/>
          <text x="520" y="127" fill="#EA580C" font-size="8.5" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">Web Speech</text>
          <text x="520" y="144" fill="#0F172A" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">音訊串流辨識</text>
          <text x="520" y="157" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">口述逐字稿提取</text>
        </g>

        <g filter="url(#card-shadow)">
          <rect x="445" y="230" width="150" height="75" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8"/>
          <text x="520" y="252" fill="#EA580C" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">Gemini 2.5 Flash</text>
          <text x="520" y="269" fill="#0F172A" font-size="12" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">自然語言意圖解析</text>
          <text x="520" y="284" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">智慧識別純淨標題、</text>
          <text x="520" y="296" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">目標欄位、優先級與日期</text>
        </g>

        <g filter="url(#card-shadow)">
          <rect x="445" y="360" width="150" height="70" rx="6" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2"/>
          <text x="520" y="382" fill="#EA580C" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">極簡預覽彈窗</text>
          <text x="520" y="399" fill="#0F172A" font-size="11.5" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">純淨預覽與微調</text>
          <text x="520" y="413" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">一鍵確認加入</text>
          <text x="520" y="423" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">自主學習使用者偏好</text>
        </g>

        <!-- 自然語言速記路徑 -->
        <g filter="url(#card-shadow)">
          <rect x="330" y="500" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2"/>
          <text x="390" y="522" fill="#EA580C" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">B. 自然語言速記</text>
          <text x="390" y="539" fill="#0F172A" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">頂部 Hero 語意輸入</text>
          <text x="390" y="552" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">例：「開會 !urgent」</text>
        </g>

        <!-- 手動與收件匣路徑 -->
        <g filter="url(#card-shadow)">
          <rect x="330" y="620" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
          <text x="390" y="642" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">C. 手動 / 收件匣</text>
          <text x="390" y="659" fill="#0F172A" font-size="11" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">行內新增與側邊欄</text>
          <text x="390" y="672" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">鍵盤 Enter 即時加入</text>
        </g>

        <!-- [階段 3：看板操作與執行] -->
        <!-- 看板拖曳引擎 (核心藍色) -->
        <g filter="url(#card-shadow)">
          <rect x="620" y="475" width="240" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
          <text x="635" y="498" fill="#2563EB" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700">拖曳引擎 · LEXORANK 排序</text>
          <text x="635" y="520" fill="#0F172A" font-size="13.5" font-family="'Noto Sans TC', sans-serif" font-weight="700">平滑流暢雙向拖曳 (DnD)</text>
          <text x="635" y="538" fill="#334155" font-size="9.5" font-family="'Noto Sans TC', sans-serif">• 幽靈佔位 (Ghost Card, opacity-35) 杜絕跳動</text>
          <text x="635" y="553" fill="#334155" font-size="9.5" font-family="'Noto Sans TC', sans-serif">• 簡約素雅灰色塊插槽 (Subtle Gray Slot)</text>
          <text x="635" y="568" fill="#334155" font-size="9.5" font-family="'Noto Sans TC', sans-serif">• 跨欄拖入自動鎖定頂端首位 (Index 0)</text>
        </g>

        <!-- Markdown 任務筆記 -->
        <g filter="url(#card-shadow)">
          <rect x="620" y="355" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
          <text x="635" y="377" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700">任務詳情與筆記</text>
          <text x="635" y="396" fill="#0F172A" font-size="12" font-family="'Noto Sans TC', sans-serif" font-weight="700">Markdown 筆記與待辦清單</text>
          <text x="635" y="411" fill="#64748B" font-size="9.5" font-family="'Noto Sans TC', sans-serif">子任務快速勾選 · 超過 500px 漸層折疊展開</text>
        </g>

        <!-- 雙視圖與批次操作 -->
        <g filter="url(#card-shadow)">
          <rect x="620" y="235" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>
          <text x="635" y="257" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700">雙重視圖與批次管理</text>
          <text x="635" y="276" fill="#0F172A" font-size="12" font-family="'Noto Sans TC', sans-serif" font-weight="700">看板 ⟷ 行事曆視圖切換</text>
          <text x="635" y="291" fill="#64748B" font-size="9.5" font-family="'Noto Sans TC', sans-serif">手機版雙行操作列 · 多選批次搬移與完成</text>
        </g>

        <!-- [階段 4：持久化與同步] -->
        <!-- 已完成任務自動沉底 -->
        <g filter="url(#card-shadow)">
          <rect x="940" y="235" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
          <text x="1010" y="257" fill="#059669" font-size="9" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">已完成任務收合</text>
          <text x="1010" y="274" fill="#0F172A" font-size="11.5" font-family="'Noto Sans TC', sans-serif" font-weight="700" text-anchor="middle">自動沉底折疊</text>
          <text x="1010" y="287" fill="#64748B" font-size="9" font-family="'Noto Sans TC', sans-serif" text-anchor="middle">「已完成 (N)」收合條</text>
        </g>

        <!-- 即時同步與持久化 -->
        <g filter="url(#card-shadow)">
          <rect x="940" y="500" width="140" height="70" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
